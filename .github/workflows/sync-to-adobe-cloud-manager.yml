name: Sync to Adobe Cloud Repository

on:
  push:
    branches:
      - main # Trigger on pushes to the main branch

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch all history for proper syncing

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Add Adobe Cloud Repository Remote
        run: |
          git remote add adobe-cloud https://git.cloudmanager.adobe.com/sobeyscapitalincorporated/DXP-Demo.git
          git fetch adobe-cloud

      - name: Force Push to Adobe Cloud Repository
        run: |
          git push https://varun-kohli-sobeys-com:GClxumhK2DkdS7J3LvxbwAOZDH0V6iGua6vYiZgf0Bwx8hIDwqC1JQQJ99ALACAAAAAFjjIdAAASAZDOMDFB@<ADOBE_CLOUD_REPO_URL>.git master --force