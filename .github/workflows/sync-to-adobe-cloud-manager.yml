name: Sync to Adobe Cloud Repository

on:
  push:
    branches:
      - main # Trigger on pushes to the main branch

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Fetch all history for proper syncing

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Add Adobe Cloud Repository Remote
        run: |
          git remote add adobe-cloud https://git.cloudmanager.adobe.com/sobeyscapitalincorporated/DXP-Demo.git
          git fetch adobe-cloud

      - name: Force Push to Adobe Cloud Repository
        env:
          ADOBE_CLOUD_USERNAME: ${{ secrets.ADOBE_CLOUD_USERNAME }}
          ADOBE_CLOUD_PASSWORD: ${{ secrets.ADOBE_CLOUD_PASSWORD }}
        run: |
          git push https://$ADOBE_CLOUD_USERNAME:$ADOBE_CLOUD_PASSWORD@<ADOBE_CLOUD_REPO_URL>.git main --force